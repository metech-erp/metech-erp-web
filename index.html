body{margin:0;min-height:100vh;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--ground);display:flex}

.btn{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;border-radius:12px;font:500 17px 'Archivo',system-ui,sans-serif;text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover,.btn-primary:focus-visible{background:#2E2E2E}
.btn-secondary{margin-top:12px;background:#fff;color:var(--ink);border:1px solid #D6D6D2}
.btn-secondary:hover,.btn-secondary:focus-visible{border-color:var(--ink)}
.btn:focus-visible{outline:3px solid rgba(20,20,20,.25);outline-offset:2px}
.note{margin:24px 0 0;padding-top:20px;border-top:1px solid #E6E6E2;font-size:14px;line-height:1.5;color:var(--muted);text-align:center}
@media (max-width:991px){
